# Squash merges make the PR title the commit subject, so it must be a Conventional Commit; release
# notes are grouped by its type. Kept out of ci.yaml so editing a title doesn't re-run CI.
name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the Title Is a Conventional Commit
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The description "{subject}" in "{title}" must start with a lowercase letter and must not end with a period.
