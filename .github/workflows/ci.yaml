# Go repo CI: lint, test and vulnerability scan on PRs and in the merge queue, with one aggregator
# check ("CI OK") for branch protection.
name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # Must match the golangci-lint that `make lint` runs (GO_TOOLS_IMAGE in the Makefile).
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test Go Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Run Go Tests
        run: go test -count=1 ./...

  vulncheck:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      # govulncheck is a tool directive in go.mod (`go get -tool golang.org/x/vuln/cmd/govulncheck`),
      # so its version is pinned and bumped like any dependency.
      - name: Run govulncheck
        run: go tool govulncheck ./...

  # The one check branch protection requires. Skipped jobs count as passing.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, vulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail If Any Job Failed or Was Cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
