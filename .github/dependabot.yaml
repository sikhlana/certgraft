# Commit messages follow Conventional Commits.
version: 2

updates:
  # "/" covers .github/workflows; local composite actions are listed too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # New releases wait 7 days before a PR; security updates are exempt.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # Base images pinned by digest in Dockerfiles.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
